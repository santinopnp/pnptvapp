<style>
body{background:#0a0a0a;margin:0;position:relative;width:4300px;height:4020px;transform-origin:0 0}
#zoombar{position:fixed;left:14px;bottom:14px;z-index:9999;display:flex;gap:6px;background:rgba(20,20,24,0.92);border:1px solid #2a2a2a;border-radius:10px;padding:6px;font-family:"Roboto Mono",monospace}
#zoombar button{background:#1e1e1e;border:1px solid #2a2a2a;color:#e8e8ea;font:11px "Roboto Mono",monospace;border-radius:6px;padding:5px 10px;cursor:pointer}
#zoombar button:hover{border-color:#D4007A;color:#fff}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
image-slot{color:rgba(255,255,255,0.6);background:linear-gradient(160deg,#33162a 0%,#1a0d16 60%,#140a10 100%);box-shadow:inset 0 0 0 1px rgba(212,0,122,0.3)}
image-slot.avatar-slot{font-size:0;color:transparent}
image-slot[shape="circle"]{border-radius:50%}
.frame-label{font-family:"Ethnocentric Rg","Roboto Mono",monospace;font-size:15px;letter-spacing:.06em;color:#e8e8ea;text-transform:uppercase;position:absolute;white-space:nowrap}
.section-label{font-family:"Ethnocentric Rg","Roboto Mono",monospace;color:#D4007A;font-size:13px;letter-spacing:.14em;text-transform:uppercase;position:absolute;white-space:nowrap}
</style>
</head>
<body>
<div id="zoombar"><button onclick="omZoom('fit')">Fit all</button><button onclick="omZoom(0.45)">45%</button><button onclick="omZoom(0.7)">70%</button><button onclick="omZoom(1)">100%</button></div>
<script>function omZoom(z){if(z==='fit'){z=Math.min(window.innerWidth/4300,window.innerHeight/4020)}document.body.style.zoom=z;document.getElementById('zoombar').style.zoom=1/z;try{localStorage.setItem('pnptv-mockup-zoom',z)}catch(e){}}
window.addEventListener('DOMContentLoaded',function(){var s=null;try{s=parseFloat(localStorage.getItem('pnptv-mockup-zoom'))}catch(e){}if(s){document.body.style.zoom=s;document.getElementById('zoombar').style.zoom=1/s}});</script>
