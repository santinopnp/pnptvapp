    <!-- Splash boot-failure watchdog — runs before main.tsx so it covers the
         worst case where the module bundle never loads (old in-app webviews,
         CSP / extension blocks, network failure on /assets/*.js). If React
         mounts within 10s, main.tsx adds .hide to #splash and this no-ops.
         Doesn't change any page logic — only swaps the spinner for an
         actionable error UI when the splash would otherwise hang forever. -->
    <script>
      (function () {
        var SPLASH_WATCHDOG_MS = 15000;
        var SPLASH_WATCHDOG_MAX_MS = 45000;
        function isSplashVisible() {
          var s = document.getElementById("splash");
          return !!(s && !s.classList.contains("hide"));
        }
        // True if the browser is still fetching /assets/* modules — antivirus
        // extensions (Kaspersky Anti-Banner et al) rewrite our CSP and inspect
        // every byte, so heavy sessions can spend 20-30s in module parse
        // before React mounts. Extending the deadline while resources are
        // still loading avoids false "boot failure" UI on healthy-but-slow
        // sessions. Only truly stuck boots (zero active loads) trip the UI.
        function assetsStillLoading() {
          try {
            if (!performance || !performance.getEntriesByType) return false;
            var entries = performance.getEntriesByType("resource");
            for (var i = 0; i < entries.length; i++) {
              var e = entries[i];
              // duration===0 + responseEnd===0 means fetch not yet complete

              }

          } catch (_) { return false; }

          if (!isSplashVisible()) return;
          try { console.warn("[pnptv] boot failure:", reason); } catch (_) {}
          var loading = document.getElementById("splash-loading");
          var error = document.getElementById("splash-error");
          if (loading) loading.style.display = "none";
          if (error) error.style.display = "flex";
          var reloadBtn = document.getElementById("splash-error-reload");
          var resetBtn = document.getElementById("splash-error-reset");
          if (reloadBtn) reloadBtn.onclick = function () { window.location.reload(); };
          if (resetBtn) resetBtn.onclick = function () {
            try {
              var u = new URL(window.location.href);
              u.searchParams.set("update", "1");
              window.location.replace(u.toString());
            } catch (_) {
              window.location.reload();
            }

        //    is still loading. Re-checks every 5s up to SPLASH_WATCHDOG_MAX_MS.

          if (!isSplashVisible()) return;
          var elapsed = Date.now() - watchdogStart;
          if (assetsStillLoading() && elapsed < SPLASH_WATCHDOG_MAX_MS) {
            setTimeout(checkTimeout, 5000);
            return;
          }

        //    404s, parse failures, and any <script>/<link> load failures
        //    that happen before React mounts.
