# Legal & policy pages — served by the bot (Express GET handlers in
# routes.js around line 993). Without these explicit locations, npm-proxy
# falls back to pnptv-web which returns the SPA shell instead of the policy
# page, leaving users with stale or missing content. Each must be `location =`
# (exact match) to avoid swallowing /community-guidelines/anything.
