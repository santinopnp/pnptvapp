    if ($http_authorization != "Bearer daa808258f0e587bf36af8b6fe131c241d35b9b4df122f1ded5c7ab7bb319cca") {
        add_header WWW-Authenticate 'Bearer resource_metadata="https://pnptv.app/.well-known/oauth-protected-resource$uri"' always;
