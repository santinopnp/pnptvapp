# =============================================================================
# pnptv.app — NPM Proxy Host #10 Override
# =============================================================================
# This is the versioned source-of-truth for the pnptv.app Nginx routing.
# NPM auto-generates proxy_host/10.conf, but it only knows about a single
# upstream. This file contains the backend location blocks that must be
# injected into that config so the SPA + API split-routing works.
#
# Default upstream (location /): pnptv-web:80  (React SPA)
# Backend upstream:               pnptv-bot:3001 (Node.js Express)
#
# All proxy_pass directives use Docker's embedded DNS resolver (127.0.0.11)
# via upstream variables so Nginx picks up new container IPs after restart
# WITHOUT a full reload. Previously, restarting pnptv-bot would pin Nginx to
# the old cached IP and every /api/* request returned 502 until an explicit
# `nginx -s reload`. See 2026-04-19 login outage.
#
# Apply with:  scripts/apply-npm-routing.sh
# =============================================================================

# ---- Docker DNS resolver (lazy-resolve upstream names per request) ----
resolver 127.0.0.11 valid=30s ipv6=off;

# ---- Upstream variables (server scope — referenced by every location) ----
set $bot_backend http://pnptv-bot:3001;
set $directus_backend http://directus:8055;

# ---- Privacy: strip backend identity from all proxied responses ----
proxy_hide_header X-Powered-By;
proxy_hide_header Server;

# ---- Admin API routes — IP-restricted (190.13.59.88 only) ----

location /api/admin/ {
    proxy_pass $bot_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    client_max_body_size 3200m;
}

# ---- Backend API routes → Node.js ----

location /api/ {
    proxy_pass $bot_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    client_max_body_size 3200m;
    proxy_request_buffering off;
    # Generous timeouts so slow 2 GB creator video uploads don't get cut mid-stream.
    # At 10 Mbps a 2 GB body takes ~27 min; 3600s gives a safety margin up to ~4.5 Mbps.
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

