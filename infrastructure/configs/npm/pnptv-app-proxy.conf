# ---- MCP gateway for Lex (Claude custom connectors) ----
# Bearer token auth; token in /root/.lex-mcp-token.
# Streamable HTTP transport → each endpoint proxies to mcp-{postgres,filesystem,slack}:/mcp.
# The `if` on the auth header is safe (only `return` inside).
# OAuth 2.1 authorization server runs at /oauth/mcp-lex/* → mcp-oauth:3013.
set $mcp_pg http://mcp-postgres:3010;
set $mcp_fs http://mcp-filesystem:3011;
set $mcp_sl http://mcp-slack:3012;
set $mcp_oauth http://mcp-oauth:3013;
set $mcp_notion http://mcp-notion:3014;
set $mcp_adm http://mcp-admin:3015;

# OAuth authorization server + discovery — public, no auth
# Note: proxy_pass with variables does NOT rewrite URI on trailing slash, so we
# use rewrite to strip the /oauth/mcp-lex prefix explicitly.
location /oauth/mcp-lex/ {
    rewrite ^/oauth/mcp-lex/(.*)$ /$1 break;
    proxy_pass $mcp_oauth;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}
# All /.well-known/ OAuth + OIDC discovery paths (root + path-based per RFC 8414)
location ~ ^/\.well-known/(oauth-authorization-server|openid-configuration|oauth-protected-resource) {
    proxy_pass $mcp_oauth$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}

location = /mcp-lex/postgres {
    if ($http_authorization != "Bearer daa808258f0e587bf36af8b6fe131c241d35b9b4df122f1ded5c7ab7bb319cca") {
        add_header WWW-Authenticate 'Bearer resource_metadata="https://pnptv.app/.well-known/oauth-protected-resource$uri"' always;
        return 401 "Unauthorized\n";
    }
    proxy_pass $mcp_pg/mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
}

location = /mcp-lex/filesystem {
    if ($http_authorization != "Bearer daa808258f0e587bf36af8b6fe131c241d35b9b4df122f1ded5c7ab7bb319cca") {
        add_header WWW-Authenticate 'Bearer resource_metadata="https://pnptv.app/.well-known/oauth-protected-resource$uri"' always;
        return 401 "Unauthorized\n";
    }
    proxy_pass $mcp_fs/mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_buffering off;
