# ---- Exact-match backend page routes ----

# NOTE: /login is intentionally NOT listed here. It must fall through to the
# default `location /` so the React SPA renders LandingPage.tsx (inline
# passkey + magic-link + native /api/webapp/auth/register form). Do NOT
# reintroduce a `location = /login` block — the old backend page served
# apps/public/login.html which linked "Create account" straight to
# auth.pnptv.app's enrollment flow (which is not publicly enabled and
# returns "not authorized"). See 2026-07-23 signup outage.

location = /health {
    proxy_pass $bot_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /terms {
