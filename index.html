<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PNPtv! Intro Curtain</title>

    <!-- Body face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Display face (Ethnocentric). Third-party host; if it is unreachable the
      stack in theme.ts falls back to Roboto Mono. To make renders deterministic,
      drop a licensed woff2 at public/fonts/ethnocentric.woff2 and the
      @font-face below picks it up ahead of the CDN. See FONTS.md.
    -->
    <link href="https://fonts.cdnfonts.com/css/ethnocentric" rel="stylesheet" />
    <style>
      @font-face {
        font-family: 'Ethnocentric Rg';
        src: url('fonts/ethnocentric.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #121212;
        color: #fff;
        font-family: 'Roboto Mono', monospace;
      }

      #root {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
